syntax = "proto3";

package hz.v1;

// Node 注册与 Network Map 下发的控制面契约。
// Machine Key 用 ed25519 签挑战；Node Key 是 x25519 数据面公钥。

service Coord {
  // 获取挑战值。protocol_version 过旧会被拒绝并附升级提示。
  rpc Hello(HelloRequest) returns (HelloResponse);
  // 用 Auth Key + 挑战签名完成注册（FR-1）。
  rpc RegisterWithAuthKey(RegisterAuthKeyRequest) returns (RegisterResponse);
  // 交互式登录，票据 #10 实现。
  rpc BeginInteractiveLogin(BeginLoginRequest) returns (BeginLoginResponse);
  // 交互式登录结果轮询：Node 侧在浏览器完成登录后取回注册结果。
  rpc LoginStatus(LoginStatusRequest) returns (LoginStatusResponse);
  // Network Map 下发流：打开即发全量快照并保持打开；推送更新在票据 #6。
  rpc StreamNetworkMap(StreamMapRequest) returns (stream NetworkMapMessage);
  // Relay 代理的 Node 身份校验（FR-9）：Relay 呈上 bootstrap 签发的 relay token
  // 与 Node 的 Machine-Key 挑战签名，Coordination Server 代为验证。
  rpc RelayCheckNode(RelayCheckRequest) returns (RelayCheckResponse);
  // Endpoint 上报（FR-8）：Node 周期性把 Lan/STUN/IPv6 Endpoint 报上来，
  // 服务端落库并随 Network Map 差量推给其他 Node。与打洞信令无关——
  // 实时协商走 Relay 通道，不经 Coordination Server。
  rpc ReportEndpoints(ReportEndpointsRequest) returns (ReportEndpointsResponse);
  // Policy 整份替换（FR-10）：调用方 Node 用 Machine Key 挑战认证，
  // 服务端按 Node 归属 User 的 Admin 身份授权（A3）。校验失败整份拒绝。
  rpc PolicyPush(PolicyPushRequest) returns (PolicyPushResponse);
  // 查看当前 Policy 与历史版本列表（FR-10）。
  rpc PolicyGet(PolicyGetRequest) returns (PolicyGetResponse);
  // 回滚到历史版本：内容须仍通过校验，否则拒绝。
  rpc PolicyRollback(PolicyRollbackRequest) returns (PolicyRollbackResponse);
  // ---- Admin 远程管理（FR-11 / #12）：以下 rpc 全部携带标准挑战认证字段，
  // 操作者 = 调用方 Node 归属的 User（A3）；带 Tag 的 Node 一律拒绝。----
  // 签发 Auth Key（仅 Admin）：明文只在应答里出现一次。
  rpc AdminCreateAuthKey(AdminCreateAuthKeyRequest) returns (AdminCreateAuthKeyResponse);
  // 吊销 Auth Key（仅 Admin）：吊销后不可再用于注册。
  rpc AdminRevokeAuthKey(AdminRevokeAuthKeyRequest) returns (AdminRevokeAuthKeyResponse);
  rpc AdminCreateInvite(AdminCreateInviteRequest) returns (AdminCreateInviteResponse);
  rpc AdminListInvites(AdminListInvitesRequest) returns (AdminListInvitesResponse);
  rpc AdminRevokeInvite(AdminRevokeInviteRequest) returns (AdminRevokeInviteResponse);
  // 列出 Node（Admin 看全部含已吊销；普通 User 只看自己名下）。
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // 改名（Admin 任意 Node；普通 User 仅自己名下）：新名规范化后须唯一。
  rpc RenameNode(RenameNodeRequest) returns (RenameNodeResponse);
  // 删除 Node（Admin 任意；普通 User 仅自己名下）：硬删行，立即退出所有 Map。
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
  // 吊销 Node（仅 Admin）：保留行供审计，立即退出所有 Map 且无法通信。
  rpc RevokeNode(RevokeNodeRequest) returns (RevokeNodeResponse);
}

message HelloRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
}

message HelloResponse {
  bytes challenge_nonce = 1;
  int64 challenge_expires_unix = 2;
  string server_version = 3;
}

message RegisterAuthKeyRequest {
  bytes challenge_nonce = 1;
  bytes challenge_signature = 2;
  string auth_key = 3;
  bytes node_key_pub = 4;
  // 短邀请码（#55）：设置时忽略 auth_key，按邀请的归属/Tag/有效期注册。
  optional string invite_code = 5;
}

message RegisterResponse {
  NodeInfo node = 1;
  // 生效的 IPv4 段与段内推导的 DNS 应答地址（FR-4）：Node 据此配置 TUN 路由
  // 与本地 DNS，替代易失配的 HZD_V4_CIDR 环境变量。
  optional string network_cidr = 2;
  optional string dns_v4 = 3;
}

message NodeInfo {
  string node_id = 1;
  string name = 2;
  string ipv4 = 3;
  string ipv6 = 4;
  repeated string tags = 5;
  optional string owner_user = 6;
  optional int64 expires_at_unix = 7;
  // Node Key 公钥（x25519，32 字节），数据面建立 WireGuard 会话用。
  bytes node_key_pub = 8;
  // 该 Node 的 UDP Endpoint（"ip:port"）兼容视图：全部来源拍平成字符串。
  repeated string endpoints = 9;
  // 按 Endpoint 来源区分的视图（FR-8）：对端排打洞候选序用（IPv6 优先）。
  repeated Endpoint detailed_endpoints = 10;
}

// Endpoint 的发现途径。
enum EndpointKind {
  ENDPOINT_KIND_UNSPECIFIED = 0;
  // 非虚拟网卡的 IPv4 + WireGuard 端口（同网段可达）。
  ENDPOINT_KIND_LAN = 1;
  // STUN 发现的公网映射（NAT 外侧）。
  ENDPOINT_KIND_STUN = 2;
  // 网卡上的全球单播 IPv6（无 NAT 预期）。
  ENDPOINT_KIND_V6 = 3;
}

message Endpoint {
  // IP 字面量（v4 或 v6），不带端口。
  string addr = 1;
  uint32 port = 2;
  EndpointKind kind = 3;
}

message ReportEndpointsRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  // 本 Node 当前的全部 Endpoint（整体覆盖旧值）。
  repeated Endpoint endpoints = 6;
  // 打洞结果记账（FR-12 打洞成功率）：本 Node 自启动起的累计值，
  // 服务端按 Node 去重差量后累加进全局计数。旧客户端缺省不上报。
  optional PathReport path_report = 7;
}

message ReportEndpointsResponse {}

// Node 侧路径管理的累计计数。attempts = 发起的打洞轮次，
// success = 从 Relayed 升级到 Direct 的次数。
message PathReport {
  uint32 punch_attempts = 1;
  uint32 punch_success = 2;
}

message BeginLoginRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  // Node Key 公钥（x25519）；登录回调落定时绑定到该 Node。
  bytes node_key_pub = 6;
}

message BeginLoginResponse {
  string login_url = 1;
  int64 expires_unix = 2;
}

message LoginStatusRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  // BeginLogin 返回的一次性登录标识（login_url 的最后一段）。
  string login_id = 6;
}

message LoginStatusResponse {
  // false = 浏览器侧尚未完成登录，继续轮询。
  bool completed = 1;
  optional NodeInfo node = 2;
  // 终态错误（链接被重复使用、已过期、IdP 拒绝等），中文可读。
  optional string error = 3;
  // 与 RegisterResponse 同义；交互式登录路径同样需要生效段信息。
  optional string network_cidr = 4;
  optional string dns_v4 = 5;
}

message StreamMapRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  // 本 Node 当前可用的 UDP Endpoint（"ip:port"），服务端在打开流时落库。
  repeated string endpoints = 6;
}

message NetworkMapMessage {
  oneof kind {
    NetworkMap full = 1;
    MapDelta delta = 2;
  }
  // Policy 语境（#13）：当前版本号 + 本 Node 视角的入站过滤规则。
  // 无 Policy（bootstrap 全互通）时不携带；Policy 变化时随消息下发，
  // 目标 Node 据此过滤入站流量（A1）。
  PolicyView policy = 3;
}

// 下发给单个 Node 的 Policy 视图：version 与 Group 定义是全局的，
// inbound_rules 已按"to 侧命中该 Node"筛过。
message PolicyView {
  int64 version = 1;
  repeated PolicyGroup groups = 2;
  repeated InboundRule inbound_rules = 3;
}

message PolicyGroup {
  string name = 1;
  repeated string users = 2;
}

// to 侧命中本 Node 的一条规则：from 主体 + 允许端口。
message InboundRule {
  // "group:dev" | "user:alice" | "tag:ci"
  string from = 1;
  repeated uint32 ports = 2;
}

message NetworkMap {
  repeated NodeInfo nodes = 1;
}

message MapDelta {
  repeated NodeInfo added_or_updated = 1;
  repeated string removed_node_ids = 2;
}

message RelayCheckRequest {
  string relay_token = 1;
  string node_id = 2;
  bytes machine_key_pub = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
}

message RelayCheckResponse {
  bool valid = 1;
  string reason = 2;
}

message PolicyPushRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  // TOML 原文，整份替换。
  string content = 6;
}

message PolicyPushResponse {
  // 服务端分配的新版本号。
  int64 version = 1;
}

message PolicyGetRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
}

message PolicyGetResponse {
  // 当前 Policy 的 TOML 原文；尚无 Policy 时为空。
  optional string content = 1;
  // 当前版本号；尚无 Policy 时为 0。
  int64 version = 2;
  repeated PolicyVersionInfo history = 3;
}

message PolicyVersionInfo {
  int64 version = 1;
  int64 created_at_unix = 2;
}

message PolicyRollbackRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  int64 version = 6;
}

message PolicyRollbackResponse {
  int64 version = 1;
}

// ---- Admin 远程管理（FR-11 / #12）的消息，与上方 rpc 同期新增 ----

message AdminCreateAuthKeyRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  // 必填：Auth Key 的过期时刻（unix 秒）。
  int64 expires_unix = 6;
  // 一次性 Key（用一次即作废）。
  bool single_use = 7;
  // 预绑定 Tag，可多个。
  repeated string tags = 8;
}

message AdminCreateAuthKeyResponse {
  // 明文 Key，仅此一次返回。
  string auth_key = 1;
  // 供 AdminRevokeAuthKey 吊销用。
  string key_id = 2;
}

message AdminRevokeAuthKeyRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  string key_id = 6;
}

message AdminRevokeAuthKeyResponse {}
// —— 邀请码管理（#55）——

message AdminCreateInviteRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  // 邀请码有效期（秒），默认 900（15 分钟）。
  int64 ttl_secs = 6;
  // 最大使用次数，默认 1。
  int64 max_uses = 7;
  // 带 Tag 的无主邀请（与 owner_name 二选一）。
  repeated string tags = 8;
  // 有主邀请：注册出的 Node 归属该 User（与 tags 二选一）。
  optional string owner_name = 9;
  // 有主邀请的 Node 有效期（天），默认 90。
  optional int64 node_ttl_days = 10;
}

message AdminCreateInviteResponse {
  // 明文邀请码（HZ-XXXX-XXXX），仅此一次返回。
  string invite_code = 1;
  string invite_id = 2;
}

message AdminListInvitesRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
}

message InviteInfo {
  string invite_id = 1;
  int64 created_at_unix = 2;
  int64 expires_at_unix = 3;
  int64 max_uses = 4;
  int64 use_count = 5;
  repeated string tags = 6;
  optional string owner_name = 7;
  optional int64 node_ttl_days = 8;
  string created_by = 9;
  optional int64 last_used_at_unix = 10;
  optional int64 revoked_at_unix = 11;
}

message AdminListInvitesResponse {
  repeated InviteInfo invites = 1;
}

message AdminRevokeInviteRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  string invite_id = 6;
}

message AdminRevokeInviteResponse {}

message ListNodesRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
}

// Admin 视角的 Node 行（比 NodeInfo 多吊销标记，少数据面字段）。
message AdminNodeInfo {
  string node_id = 1;
  string name = 2;
  string ipv4 = 3;
  string ipv6 = 4;
  repeated string tags = 5;
  optional string owner_user = 6;
  optional int64 expires_at_unix = 7;
  // true = 已吊销（保留行供审计，不在任何 Network Map 里）。
  bool revoked = 8;
}

message ListNodesResponse {
  repeated AdminNodeInfo nodes = 1;
}

message RenameNodeRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  string node_id = 6;
  // 期望的新 Node Name；服务端按 Node Name 规则规范化后要求唯一。
  string new_name = 7;
}

message RenameNodeResponse {
  // 规范化并落库后的新名字。
  string name = 1;
}

message DeleteNodeRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  string node_id = 6;
}

message DeleteNodeResponse {}

message RevokeNodeRequest {
  uint32 protocol_version = 1;
  bytes machine_key_pub = 2;
  string hostname = 3;
  bytes challenge_nonce = 4;
  bytes challenge_signature = 5;
  string node_id = 6;
}

message RevokeNodeResponse {}
