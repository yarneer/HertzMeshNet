[package]
name = "hz-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 经 cargo-ndk 构建 libhz_android.so（release arm64-v8a；debug 另加 x86_64）。
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
hz-core.workspace = true
hz-engine.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }
libc.workspace = true

# JNI 绑定（仅 Android 目标需要；host 跑纯逻辑单测）。
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile.workspace = true
