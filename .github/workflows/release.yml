name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build (static musl)
        run: cargo build --release --target x86_64-unknown-linux-musl -p hzd -p hz -p hz-coord -p hz-relay
      - name: Verify static binaries
        run: |
          cd target/x86_64-unknown-linux-musl/release
          for bin in hzd hz hz-coord hz-relay; do
            file "$bin"
            file "$bin" | grep -Eq "statically linked|static-pie linked" || { echo "$bin 不是静态二进制"; exit 1; }
            readelf -d "$bin" 2>/dev/null | grep -q NEEDED && { echo "$bin 仍有动态依赖（NEEDED）"; exit 1; } || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: |
            target/x86_64-unknown-linux-musl/release/hzd
            target/x86_64-unknown-linux-musl/release/hz
            target/x86_64-unknown-linux-musl/release/hz-coord
            target/x86_64-unknown-linux-musl/release/hz-relay

  build-linux-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - name: Build (static musl)
        run: cross build --release --target aarch64-unknown-linux-musl -p hzd -p hz -p hz-coord -p hz-relay
      - name: Verify static binaries
        run: |
          cd target/aarch64-unknown-linux-musl/release
          for bin in hzd hz hz-coord hz-relay; do
            file "$bin"
            file "$bin" | grep -Eq "statically linked|static-pie linked" || { echo "$bin 不是静态二进制"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-aarch64
          path: |
            target/aarch64-unknown-linux-musl/release/hzd
            target/aarch64-unknown-linux-musl/release/hz
            target/aarch64-unknown-linux-musl/release/hz-coord
            target/aarch64-unknown-linux-musl/release/hz-relay

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p hzd -p hz
      - name: Verify arm64 binaries
        run: |
          cd target/release
          for bin in hzd hz; do
            file "$bin"
            file "$bin" | grep -q "arm64" || { echo "$bin 不是 arm64"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-arm64
          path: |
            target/release/hzd
            target/release/hz

  # #102：Android release APK——tag 时用 Secrets 中的 keystore 签名。
  # keystore 丢失即无法覆盖升级（runbook 记保管与恢复）；手动触发时无
  # secrets 则产出未签名包（仅调试用）。
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # runner 预装 SDK/NDK；挑最新 NDK 给 cargo-ndk。
      - name: 选择预装 NDK
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Rust 侧 Android 目标检查
        run: cargo check -p hz-android --target aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: 解码 release keystore（Secrets）
        run: |
          if [ -n "${{ secrets.HZNET_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.HZNET_KEYSTORE_BASE64 }}" | base64 -d > clients/android/release.keystore
            echo "HZNET_KEYSTORE_FILE=$(pwd)/clients/android/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 HZNET_KEYSTORE_BASE64，产出未签名 APK（仅调试）"
          fi
      - name: 构建 release APK（签名或未签名）
        working-directory: clients/android
        run: |
          VERSION=$(grep -m1 '^version' ../../Cargo.toml | cut -d'"' -f2)
          if [ -n "$HZNET_KEYSTORE_FILE" ]; then
            gradle assembleRelease --stacktrace -PhznetVersion=$VERSION               -PhznetKeystoreFile=$HZNET_KEYSTORE_FILE               -PhznetKeystoreAlias="${{ secrets.HZNET_KEYSTORE_ALIAS }}"               -PhznetKeystorePassword="${{ secrets.HZNET_KEYSTORE_PASSWORD }}"               -PhznetKeystoreKeyPassword="${{ secrets.HZNET_KEYSTORE_KEY_PASSWORD }}"
            cp app/build/outputs/apk/release/app-release.apk hznet.apk
          else
            gradle assembleRelease --stacktrace -PhznetVersion=$VERSION
            cp app/build/outputs/apk/release/app-unaligned.apk hznet.apk 2>/dev/null               || cp app/build/outputs/apk/release/app-release-unsigned.apk hznet.apk
          fi
          sha256sum hznet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-arm64
          path: clients/android/hznet.apk

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck install.sh 与安装测试脚本
        run: shellcheck packaging/install.sh scripts/test/install_docker.sh scripts/deploy/healthcheck.sh

  release:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-arm64, build-android, shellcheck]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-x86_64
          path: stage/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-aarch64
          path: stage/linux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: dist-darwin-arm64
          path: stage/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: dist-android-arm64
          path: stage/android-arm64
      - name: Stage assets and manifest
        run: |
          mkdir assets
          cp stage/android-arm64/hznet.apk assets/hznet.apk-android-arm64
          for arch in x86_64 aarch64; do
            for bin in hzd hz hz-coord hz-relay; do
              mv "stage/linux-$arch/$bin" "assets/$bin-linux-$arch"
            done
          done
          for bin in hzd hz; do
            mv "stage/darwin-arm64/$bin" "assets/$bin-darwin-arm64"
          done
          # manifest 的键是 <平台>/<二进制>（coord /dl 与 install.sh 的查询格式）；
          # 二进制已并入 assets/，从资产名（hzd-linux-x86_64）反解出键。
          {
            printf '{"version":"%s","files":{' "${GITHUB_REF_NAME#v}"
            first=1
            for f in $(find assets -type f -name 'hz*' ! -name 'manifest.json' | sort); do
              base=$(basename "$f")
              platform=$(echo "$base" | grep -oE '(linux-(x86_64|aarch64)|darwin-arm64)$')
              bin=${base%-$platform}
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              size=$(wc -c < "$f" | tr -d '[:space:]')
              if [ "$first" = 1 ]; then first=0; else printf ','; fi
              printf '"%s/%s":{"sha256":"%s","size":%s}' "$platform" "$bin" "$sha" "$size"
            done
            printf '}}\n'
          } > assets/manifest.json
          jq -e '.files | length >= 6' assets/manifest.json > /dev/null
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/install.sh assets/install.sh
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes assets/*
