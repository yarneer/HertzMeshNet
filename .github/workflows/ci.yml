name: CI

on:
  push:
    branches: [dev, main]
    # 只改文档不跑 CI（省 Actions 分钟）；*.sh 不在忽略之列，全角标点检查照跑。
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [dev]
    paths-ignore: ["docs/**", "**.md"]

# 同一分支连续推送时只保留最新一次运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # 固定版本：ubuntu-latest 正迁移到 Ubuntu 26，按需主动升级。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Shell 变量后全角标点检查（bash 3.2 会吞变量名）
        run: |
          if grep -rnP '\$[A-Za-z_][A-Za-z0-9_]*(?=[（）：，、。！？])' --include='*.sh' scripts packaging; then
            echo '::error::变量后紧跟全角标点必须写 ${var}'; exit 1; fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (macOS)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (macOS)
        run: cargo test --all
