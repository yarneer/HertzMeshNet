name: CI

on:
  push:
    branches: [dev, main]
    # 只改文档不跑 CI（省 Actions 分钟）；*.sh 不在忽略之列，全角标点检查照跑。
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [dev]
    paths-ignore: ["docs/**", "**.md"]

# 同一分支连续推送时只保留最新一次运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # 固定版本：ubuntu-latest 正迁移到 Ubuntu 26，按需主动升级。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Shell 变量后全角标点检查（bash 3.2 会吞变量名）
        run: |
          if grep -rnP '\$[A-Za-z_][A-Za-z0-9_]*(?=[（）：，、。！？])' --include='*.sh' scripts packaging; then
            echo '::error::变量后紧跟全角标点必须写 ${var}'; exit 1; fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  # #99：Android debug 构建 + Kotlin 单测（契约 fixture 解码）。Linux runner
  # 上 cargo ndk 交叉编译 libhz_android.so，Gradle 打 debug APK。
  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      # ubuntu-24.04 runner 预装 Android SDK 与 NDK（setup-android@v3 反而在
      # 装 legacy tools 包时失败）；挑最新 NDK 给 cargo-ndk。
      - name: 选择预装 NDK
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          ls "$NDK"
      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Rust 侧 Android 目标检查（JNI 桥编译）
        run: cargo check -p hz-android --target aarch64-linux-android
      - name: Gradle（setup-gradle 安装发行版，不依赖 wrapper jar）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Kotlin 单测（解码 clients/fixtures 全部 fixture）
        working-directory: clients/android
        run: gradle testDebugUnitTest --stacktrace -PhznetVersion=$(grep -m1 '^version' ../../Cargo.toml | cut -d'"' -f2)
      - name: 构建 debug APK（arm64-v8a + x86_64）
        working-directory: clients/android
        run: gradle assembleDebug --stacktrace -PhznetVersion=$(grep -m1 '^version' ../../Cargo.toml | cut -d'"' -f2)
      - name: 上传 debug APK（产物供真机冒烟）
        uses: actions/upload-artifact@v4
        with:
          name: hznet-debug-apk
          path: clients/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (macOS)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (macOS，含 fixture 重生成)
        run: cargo test --all
      - name: 契约 fixture 无漂移（#85/MC-5）
        run: git diff --exit-code clients/fixtures
      - name: Swift 测试（Kit，swift run 驱动）
        run: swift run --package-path clients/macos HzNetClientKitTests
      - name: XcodeGen 生成并构建 App（验证 SwiftUI 目标可编译）
        run: |
          brew install xcodegen
          cd clients/macos && xcodegen generate \
            && xcodebuild -project HzNetClient.xcodeproj -scheme HzNetClient -configuration Debug build \
              CODE_SIGNING_ALLOWED=NO | xcbeautify --quiet || \
            xcodebuild -project HzNetClient.xcodeproj -scheme HzNetClient -configuration Debug build \
              CODE_SIGNING_ALLOWED=NO
